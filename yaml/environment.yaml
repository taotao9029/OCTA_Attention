name: Attention

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.14
  - pip=24.2
  - setuptools
  - wheel

  # 数据处理与统计评价
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1
  - scikit-learn=1.5.1

  # 训练过程和论文图表
  - tqdm=4.65.2
  - matplotlib=3.9.0

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.0+cu128
      - einops==0.8.0
